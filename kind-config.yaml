# ============================================================
# KIND CLUSTER CONFIGURATION
# ============================================================


kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4

networking:
  apiServerAddress: "172.31.42.201" 
  # Change this to your EC2 private IP (run "hostname -I" to check or from your EC2 dashboard)
  apiServerPort: 33893
# Cluster name
name: tws-cluster

nodes:

  # ==========================================================
  # CONTROL PLANE
  # ==========================================================

  - role: control-plane

    # Kubernetes version used by the Kind node
    image: kindest/node:v1.35.8

    # --------------------------------------------------------
    # Port Mapping
    #
    # EC2 Host
    #    8080
    #      ↓
    # Kind Node
    #    30080
    # --------------------------------------------------------

    extraPortMappings:

      - containerPort: 30080
        hostPort: 8080
        protocol: TCP

  # ==========================================================
  # WORKER 1
  # ==========================================================

  - role: worker
    image: kindest/node:v1.35.8

  # ==========================================================
  # WORKER 2
  # ==========================================================

  - role: worker
    image: kindest/node:v1.35.8
